[workspace]
members = ["rust/backend", "rust/turso-probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["cors", "compression-gzip", "fs"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
uuid = { version = "=1.26.1", features = ["v4"] }
tempfile = "=3.27.0"
turso = { version = "=0.8.3", default-features = false }

