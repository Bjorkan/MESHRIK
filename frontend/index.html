<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Vite dev deep links use /; production replaces this with X-Ingress-Path. -->
    <base href="/" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MESHRIK" />
    <meta name="theme-color" content="#111419" />
    <meta
      name="description"
      content="Web interface for MeshCore mesh radio networks. Send and receive messages, manage contacts and channels, and configure your radio."
    />
    <title>MESHRIK for MeshCore</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" crossorigin="use-credentials" />
    <script>
      // Service worker registration moved to main.tsx (requires isSecureContext
      // for Web Push). Do not duplicate here.

      // Start critical data fetches before React/Vite JS loads.
      // Must be in <head> BEFORE the module script so the browser queues these
      // fetches before it discovers and starts downloading the JS bundle.
      // React hooks consume the promises via window.__prefetch.
      var fetchJsonOrThrow = function (url) {
        return fetch(url)
          .then(function (response) {
            if (response.ok) {
              return response.json();
            }
            return response.text().then(function (rawError) {
              var message = rawError || response.statusText || 'HTTP ' + response.status;
              try {
                var parsed = JSON.parse(rawError);
                if (parsed && typeof parsed.detail === 'string' && parsed.detail.length > 0) {
                  message = parsed.detail;
                }
              } catch {
                // Keep raw text fallback when body is not JSON.
              }
              throw new Error('Prefetch failed for ' + url + ': ' + message);
            });
          })
          .catch(function (err) {
            console.error(err);
            throw err;
          });
      };
      window.__prefetch = {
        config: fetchJsonOrThrow(new URL('api/radio/config', document.baseURI).href),
        settings: fetchJsonOrThrow(new URL('api/settings', document.baseURI).href),
        channels: fetchJsonOrThrow(new URL('api/channels', document.baseURI).href),
        contacts: fetchJsonOrThrow(new URL('api/contacts?limit=1000&offset=0', document.baseURI).href),
        unreads: fetchJsonOrThrow(new URL('api/read-state/unreads', document.baseURI).href),
        undecryptedCount: fetchJsonOrThrow(new URL('api/packets/undecrypted/count', document.baseURI).href),
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
