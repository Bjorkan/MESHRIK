name: All Quality

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      tag:
        description: Container tag to publish (for example, 3.17.1)
        required: true

permissions:
  contents: read

# Only pushes to main may cancel earlier main pushes. All other runs have unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bjorkan/meshrik

jobs:
  # Resolve once so quality gates and publishing always use the exact same commit.
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Resolve source SHA
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend-checks:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --dev

      - name: Set up Node.js for API contract generation
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install API contract generator
        run: npm ci
        working-directory: frontend

      - name: Check generated API contract
        run: npm run api:check
        working-directory: frontend

      - name: Backend lint
        run: uv run ruff check app/ tests/

      - name: Backend format check
        run: uv run ruff format --check app/ tests/

      - name: Backend typecheck
        run: uv run pyright app/

      - name: Backend tests
        run: PYTHONPATH=. uv run python -m pytest tests/ -v -m "not contract"

      - name: OpenAPI contract tests
        run: PYTHONPATH=. uv run python -m pytest tests/ -v -m contract -n 0

  frontend-checks:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend format check
        run: npm run format:check
        working-directory: frontend

      - name: Frontend tests
        run: npm run test:run
        working-directory: frontend
        env:
          NODE_OPTIONS: --no-experimental-webstorage

      - name: Frontend Docker-context typecheck
        run: npm run docker:typecheck
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  publish:
    needs: [source, backend-checks, frontend-checks]
    if: >-
      github.repository == 'Bjorkan/MESHRIK' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DISPATCH_TOKEN: ${{ secrets.HA_MESHRIK_DISPATCH_TOKEN }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Protect reserved channel tags
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          case "${REQUESTED_TAG}" in
            latest|edge)
              echo "Manual dispatch may not overwrite reserved tag ${REQUESTED_TAG}." >&2
              exit 1
              ;;
          esac

      - name: Resolve commit hash
        id: commit
        shell: bash
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ steps.commit.outputs.full }}
          labels: |
            org.opencontainers.image.title=MESHRIK
            org.opencontainers.image.description=Web interface for MeshCore radio mesh networks
            org.opencontainers.image.source=https://github.com/Bjorkan/MESHRIK
            org.opencontainers.image.licenses=MIT

      - name: Build and publish container
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            COMMIT_HASH=${{ steps.commit.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify public multi-platform image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          docker logout "${REGISTRY}"
          docker buildx imagetools inspect --raw "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            | jq -e '
                [.manifests[].platform | select(.os == "linux") | .architecture]
                | contains(["amd64", "arm64"])
              '

      - name: Notify HA-MESHRIK of stable publication
        if: github.event_name == 'release' && !github.event.release.prerelease && env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HA_MESHRIK_DISPATCH_TOKEN }}
          SOURCE_VERSION: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ steps.commit.outputs.full }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        shell: bash
        run: |
          payload=$(jq -n \
            --arg version "${SOURCE_VERSION#v}" \
            --arg sha "${SOURCE_SHA}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg url "${RELEASE_URL}" \
            '{event_type: "meshrik-stable-published", client_payload: {
              source_version: $version,
              source_sha: $sha,
              image_digest: $digest,
              source_url: $url
            }}')
          gh api --method POST repos/Bjorkan/HA-MESHRIK/dispatches --input - <<<"${payload}"

      - name: Notify HA-MESHRIK of edge publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HA_MESHRIK_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ steps.commit.outputs.full }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          payload=$(jq -n \
            --arg sha "${SOURCE_SHA}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg url "https://github.com/Bjorkan/MESHRIK/commit/${SOURCE_SHA}" \
            '{event_type: "meshrik-edge-published", client_payload: {
              source_sha: $sha,
              image_digest: $digest,
              source_url: $url
            }}')
          gh api --method POST repos/Bjorkan/HA-MESHRIK/dispatches --input - <<<"${payload}"
